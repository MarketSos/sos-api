version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-service:
    build:
      context: .
      dockerfile: src/Services/Core/Sos.Core.API/Dockerfile
    container_name: sos-core
    ports:
      - "5100:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=SosCoreDb;Username=postgres;Password=postgres
      - Jwt__Secret=your-super-secret-key-change-in-production-min-32-chars
      - Jwt__Issuer=Sos
      - Jwt__Audience=Sos.Clients
      - Jwt__ExpiryMinutes=60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

  catalog-service:
    build:
      context: .
      dockerfile: src/Services/Catalog/Sos.Catalog.API/Dockerfile
    container_name: sos-catalog
    ports:
      - "5200:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=SosCatalogDb;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=your-super-secret-key-change-in-production-min-32-chars
      - Jwt__Issuer=Sos
      - Jwt__Audience=Sos.Clients
      - Jwt__ExpiryMinutes=60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sos-network

  commerce-service:
    build:
      context: .
      dockerfile: src/Services/Commerce/Sos.Commerce.API/Dockerfile
    container_name: sos-commerce
    ports:
      - "5300:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=SosCommerceDb;Username=postgres;Password=postgres
      - Jwt__Secret=your-super-secret-key-change-in-production-min-32-chars
      - Jwt__Issuer=Sos
      - Jwt__Audience=Sos.Clients
      - Jwt__ExpiryMinutes=60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

  analytics-service:
    build:
      context: .
      dockerfile: src/Services/Analytics/Sos.Analytics.API/Dockerfile
    container_name: sos-analytics
    ports:
      - "5400:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=SosAnalyticsDb;Username=postgres;Password=postgres
      - Jwt__Secret=your-super-secret-key-change-in-production-min-32-chars
      - Jwt__Issuer=Sos
      - Jwt__Audience=Sos.Clients
      - Jwt__ExpiryMinutes=60
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: sos-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ReverseProxy__Clusters__core-cluster__Destinations__d1__Address=http://core-service:8080
      - ReverseProxy__Clusters__catalog-cluster__Destinations__d1__Address=http://catalog-service:8080
      - ReverseProxy__Clusters__commerce-cluster__Destinations__d1__Address=http://commerce-service:8080
      - ReverseProxy__Clusters__analytics-cluster__Destinations__d1__Address=http://analytics-service:8080
    depends_on:
      - core-service
      - catalog-service
      - commerce-service
      - analytics-service
    networks:
      - sos-network

networks:
  sos-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
