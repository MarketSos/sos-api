version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sos-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: sos-gateway
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - identity-service
    networks:
      - sos-network

  identity-service:
    build:
      context: .
      dockerfile: src/Services/Identity/Sos.Identity.API/Dockerfile
    container_name: sos-identity
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=IdentityDb;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Secret=your-super-secret-key-change-in-production-min-32-chars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sos-network

  catalog-service:
    build:
      context: .
      dockerfile: src/Services/Catalog/Sos.Catalog.API/Dockerfile
    container_name: sos-catalog
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=CatalogDb;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

  inventory-service:
    build:
      context: .
      dockerfile: src/Services/Inventory/Sos.Inventory.API/Dockerfile
    container_name: sos-inventory
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=InventoryDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

  pos-service:
    build:
      context: .
      dockerfile: src/Services/POS/Sos.POS.API/Dockerfile
    container_name: sos-pos
    ports:
      - "5004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=PosDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

  pricing-service:
    build:
      context: .
      dockerfile: src/Services/Pricing/Sos.Pricing.API/Dockerfile
    container_name: sos-pricing
    ports:
      - "5005:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=PricingDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

  crm-service:
    build:
      context: .
      dockerfile: src/Services/CRM/Sos.CRM.API/Dockerfile
    container_name: sos-crm
    ports:
      - "5006:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=CrmDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

  loyalty-service:
    build:
      context: .
      dockerfile: src/Services/Loyalty/Sos.Loyalty.API/Dockerfile
    container_name: sos-loyalty
    ports:
      - "5007:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=LoyaltyDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

  analytics-service:
    build:
      context: .
      dockerfile: src/Services/Analytics/Sos.Analytics.API/Dockerfile
    container_name: sos-analytics
    ports:
      - "5008:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Default=Host=postgres;Database=AnalyticsDb;Username=postgres;Password=postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sos-network

networks:
  sos-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
